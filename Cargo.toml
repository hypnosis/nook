[package]
name = "nook"
version = "0.3.0"
edition = "2021"
rust-version = "1.95"
description = "Hide extra menu bar icons on macOS. Native, lightweight, no hacks."
license = "MIT"
repository = "https://github.com/hypnosis/nook"
readme = "README.md"

[dependencies]
objc2 = "0.6.4"
block2 = "0.6"
objc2-foundation = { version = "0.3.2", features = ["NSTimer", "NSDate", "NSLocale", "NSArray", "NSString", "NSData", "NSDictionary", "NSValue", "NSError", "NSEnumerator", "NSURL", "NSGeometry", "NSNotification", "NSUserDefaults", "NSIndexSet", "NSObjCRuntime", "NSDistributedNotificationCenter"] }
objc2-app-kit = { version = "0.3.2", features = [
    "NSApplication",
    "NSButton",
    "NSBox",
    "NSFont",
    "NSGridView",
    "NSImageView",
    "NSLayoutAnchor",
    "NSProgressIndicator",
    "NSCell",
    "NSLayoutConstraint",
    "NSScrollView",
    "NSSplitViewController",
    "NSSplitViewItem",
    "NSSplitViewItemAccessoryViewController",
    "NSStackView",
    "NSSwitch",
    "NSTableCellView",
    "NSTableColumn",
    "NSTableView",
    "NSText",
    "NSTextField",
    "NSUserInterfaceLayout",
    "NSViewController",
    "NSClipView",
    "NSSplitView",
    "NSControl",
    "NSEvent",
    "NSImage",
    "NSMenu",
    "NSMenuItem",
    "NSPanel",
    "NSRunningApplication",
    "NSWorkspace",
    "objc2-core-graphics",
    "NSColor",
    "NSGraphics",
    "NSGraphicsContext",
    "NSResponder",
    "NSScreen",
    "NSStatusBar",
    "NSStatusBarButton",
    "NSStatusItem",
    "NSView",
    "NSWindow",
    "objc2-core-foundation",
] }
objc2-core-foundation = "*"
objc2-service-management = { version = "0.3.2", features = ["SMAppService"] }
objc2-core-graphics = { version = "0.3", features = ["CGWindow", "CGImage", "CGGeometry", "CGEvent", "CGEventTypes", "CGEventSource","CGDirectDisplay", "CGError", "CGRemoteOperation", "CGBitmapContext", "CGContext", "CGColorSpace"] }
objc2-screen-capture-kit = { version = "0.3", features = ["SCShareableContent", "SCScreenshotManager", "SCStream", "block2", "objc2-core-graphics"] }
dispatch2 = "0.3"
objc2-application-services = { version = "0.3", features = ["AXUIElement", "AXValue", "AXError", "HIServices"] }

[profile.release]
opt-level = "z"
lto = true
strip = true
codegen-units = 1
panic = "abort"

[features]
# Диагностический лог в /tmp/nook-debug.log.
debug-log = []
